- id: R101_lc4663_apportionment_language
  priority: MUST
  description: "Enforce exact LC 4663/4664 apportionment language and case law citations"
  section: "apportionment"
  when:
    - template.assembling: true
  then:
    - require_exact_text: |
        "Having taken effect on April 19, 2004, SB 899 mandated that apportionment be based on causation"
    - require_case_law_citations:
        - "Escobedo v. Marshalls (2005) 70 CCC 604"
        - "Gatten v. WCAB (2008) 73 CCC 1260"
        - "Benson v. The Permanente Medical Group (2009) 74 CCC 1100"
    - require_legal_references:
        - "Labor Code Section 4663"
        - "Labor Code Section 4664"
    - validate_percentage_breakdown:
        industrial_minimum: 1
        nonindustrial_maximum: 99
        total_equals: 100
    - require_medical_evidence_basis: true
    - add_audit: "LC 4663/4664 apportionment language validated"

- id: R102_statutory_language_precision
  priority: MUST
  description: "Ensure exact statutory language matching for all legal requirements"
  section: "legal_compliance"
  when:
    - template.assembling: true
  then:
    - validate_exact_statutory_text:
        section_4062_3: |
          "Any documents sent to the physician for record review must be accompanied by a declaration under penalty of perjury that the provider of the documents has complied with the provisions of Labor Code section 4062.3 before providing the documents to the physician. The declaration must also contain an attestation as to the total page count of the documents provided."
        section_9795: |
          "This report has been prepared pursuant to the provisions of 8 Cal. Code Regulations §9795"
        ab_1300_declaration: |
          "Pursuant to AB 1300, LC Sec. 5703, I have not violated Labor Code section 139.3"
    - validate_penalty_of_perjury_statements: true
    - require_exact_checkbox_language: true
    - add_audit: "Statutory language precision validated"

