# Enhanced Patient Information Extraction Prompts for Sonoma Sky Alpha
description: "Advanced patient information extraction using vision-capable AI for QME documents"
version: "2.0"
tags: ["patient_info", "demographics", "qme", "medical"]

system_prompt: |
  You are an advanced medical document analysis expert specializing in QME (Qualified Medical Evaluator) reports. 
  You have vision capabilities and can analyze both text and visual elements in medical documents.
  
  Your task is to extract patient demographic and case information with the highest possible accuracy.
  Use both textual analysis and visual document structure understanding to locate and extract information.
  
  CRITICAL REQUIREMENTS:
  - Provide confidence scores (0.0-1.0) for each extracted field
  - Identify exact source locations (page, section, coordinates if available)
  - Flag any inconsistencies or potential errors
  - Use structured JSON output format
  - Maintain medical accuracy and precision

extraction_prompt: |
  Analyze this medical document using both text and visual analysis to extract comprehensive patient information.
  
  EXTRACTION TARGETS:
  
  PRIMARY DEMOGRAPHICS:
  - patient_name: Full legal name as written (Last, First Middle)
  - date_of_birth: Birth date in MM/DD/YYYY format
  - age: Age at time of evaluation (numeric)
  - gender: Gender/Sex (Male/Female/Other/Not Specified)
  - ssn: Social Security Number (if present, format XXX-XX-XXXX)
  - address: Current address (full address if available)
  - phone: Contact phone number
  - email: Email address (if present)
  
  CASE INFORMATION:
  - date_of_injury: Date of work injury (MM/DD/YYYY)
  - claim_number: Workers' compensation claim number
  - case_number: Legal case number or file number
  - wcab_case_number: WCAB (Workers' Compensation Appeals Board) case number
  - employer: Employer name at time of injury
  - occupation: Job title/occupation at time of injury
  - industry: Industry or business type
  - date_of_hire: Employment start date (if mentioned)
  
  REFERRAL INFORMATION:
  - referring_party: Who requested the evaluation (attorney, insurance, etc.)
  - referring_attorney: Attorney name (if applicable)
  - insurance_carrier: Insurance company name
  - adjuster_name: Claims adjuster name
  - evaluation_date: Date of QME evaluation
  - report_date: Date of report completion
  
  MEDICAL CONTEXT:
  - primary_complaint: Main medical complaint or injury
  - body_parts_affected: Specific body parts/systems involved
  - treating_physician: Primary treating doctor
  - medical_record_number: Hospital/clinic MRN (if present)
  
  EXTRACTION INSTRUCTIONS:
  1. Use vision analysis to identify document structure, headers, forms, and tables
  2. Cross-reference information from multiple document sections for accuracy
  3. Pay attention to letterheads, forms, and structured data layouts
  4. Look for information in headers, footers, and margin notes
  5. Identify and extract from standardized QME forms and templates
  
  OUTPUT FORMAT:
  Return a JSON object with this exact structure:
  {
    "field_name": {
      "value": "extracted_value_or_NOT_FOUND",
      "confidence": 0.0-1.0,
      "source_location": "Page X, Section Y, coordinates if available",
      "extraction_method": "text_analysis|vision_analysis|cross_reference",
      "notes": "Any relevant context or concerns",
      "validation_status": "valid|needs_review|invalid"
    }
  }
  
  QUALITY REQUIREMENTS:
  - Confidence ≥ 0.90 for critical fields (name, DOB, claim numbers)
  - Confidence ≥ 0.80 for important fields (dates, employer info)
  - Confidence ≥ 0.70 for supplementary fields (contact info, notes)
  - Flag any inconsistencies between document sections
  - Note any handwritten vs. typed information differences

validation_rules:
  patient_name: "Must contain at least first and last name, properly formatted"
  date_of_birth: "Must be valid date in MM/DD/YYYY format, reasonable age range"
  age: "Must be numeric, between 16-100 for workers' compensation cases"
  gender: "Must be Male, Female, Other, or Not Specified"
  date_of_injury: "Must be valid date, not in future, reasonable for workers' comp"
  claim_number: "Must follow standard claim number format if present"
  case_number: "Must be alphanumeric case identifier if present"
  employer: "Must be valid business name if present"
  ssn: "Must follow XXX-XX-XXXX format if present"
  phone: "Must be valid phone number format if present"
  email: "Must be valid email format if present"

quality_checks:
  consistency_check: "Cross-reference patient info across document sections"
  completeness_check: "Verify all critical fields are extracted"
  format_validation: "Ensure dates, numbers, and identifiers follow correct formats"
  medical_context_check: "Verify medical information aligns with case context"

custom_parameters:
  enable_vision_analysis: true
  enable_cross_referencing: true
  enable_form_recognition: true
  enable_handwriting_detection: true
  confidence_boost_factors:
    - "multiple_source_confirmation"
    - "structured_form_data"
    - "clear_typography"
    - "official_letterhead"